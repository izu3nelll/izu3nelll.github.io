<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | izumiemi</title>
  <meta name="description" content="izumiemiへのお仕事のご相談・お問い合わせはこちらから。">
  <link rel="stylesheet" href="style.css">
  <style>
    .contact-form {
      max-width: 560px;
      margin-top: 56px;
    }
    .form-group {
      margin-bottom: 32px;
    }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.25s;
      letter-spacing: 0.02em;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--border-hover);
    }
    .form-group textarea {
      height: 180px;
      resize: vertical;
      line-height: 1.8;
    }
    .form-submit {
      display: inline-block;
      padding: 14px 40px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.25s, color 0.25s, background 0.25s;
    }
    .form-submit:hover {
      border-color: var(--text-white);
      color: var(--text-white);
      background: var(--bg-card-hover);
    }
    .form-note {
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.8;
    }
    .form-success {
      display: none;
      margin-top: 32px;
      padding: 24px 28px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.9;
    }
    .form-success strong {
      display: block;
      color: var(--text-white);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas" class="bg-canvas-inner"></canvas>

  <nav class="nav">
    <a href="index.html" class="nav__logo">izumiemi</a>
    <ul class="nav__links">
      <li><a href="works.html">Works</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="mindset.html">Mindset</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <div class="nav__hamburger" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </div>
    <div class="nav__overlay">
      <a href="index.html">Home</a>
      <a href="works.html">Works</a>
      <a href="skills.html">Skills</a>
      <a href="mindset.html">Mindset</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <div class="page-wrapper">

    <div class="page-hero">
      <div class="container">
        <p class="page-hero__label fade-in">04 — Contact</p>
        <h1 class="page-hero__title fade-in">Contact</h1>
      </div>
    </div>

    <section class="section">
      <div class="container">

        <p class="mindset-intro fade-in">お仕事のご相談、お気軽にどうぞ。<br>通常2〜3営業日以内にご返信します。</p>

        <div class="contact-form fade-in">
          <form id="contact-form" action="https://formspree.io/f/xbdpgkez" method="POST">

            <div class="form-group">
              <label for="name">お名前</label>
              <input type="text" id="name" name="name" placeholder="山田 太郎" required>
            </div>

            <div class="form-group">
              <label for="email">メールアドレス</label>
              <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
              <label for="subject">件名</label>
              <input type="text" id="subject" name="subject" placeholder="動画編集のご依頼について">
            </div>

            <div class="form-group">
              <label for="message">メッセージ</label>
              <textarea id="message" name="message" placeholder="ご依頼内容・ご予算・納期などをお気軽にお書きください。" required></textarea>
            </div>

            <button type="submit" class="form-submit">Send Message</button>
            <p class="form-note">※ 送信後、自動返信メールはございません。<br>内容を確認の上、折り返しご連絡いたします。</p>
          </form>

          <div class="form-success" id="form-success">
            <strong>送信完了しました。</strong>
            内容を確認の上、2〜3営業日以内にご返信いたします。
          </div>
        </div>

      </div>
    </section>

    <div class="site-footer">
      <div class="container">
        <p class="site-footer__copy">© 2026 izumiemi All Rights Reserved.</p>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      let w, h, time = 0, animId;
      let mouse = { x: 0.5, y: 0.5 };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX / w; mouse.y = e.clientY / h;
      });

      const waves = [];
      const waveCount = 22;
      for (let i = 0; i < waveCount; i++) {
        const t = i / waveCount;
        waves.push({
          yOffset: 0.2 + t * 0.6,
          amplitude: 35 + Math.random() * 55,
          frequency: 0.002 + Math.random() * 0.003,
          speed: 0.008 + Math.random() * 0.012,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.03 + (1 - Math.abs(t - 0.5) * 2) * 0.1,
          hue: 235 + i * 5.5,
          thickness: 0.6 + Math.random() * 0.5,
        });
      }

      function drawWave(wave, t) {
        ctx.beginPath();
        const mxInf = (mouse.x - 0.5) * 40;
        const myInf = (mouse.y - 0.5) * 25;
        for (let x = -20; x <= w + 20; x += 3) {
          const nx = x / w;
          const baseY = h * wave.yOffset;
          const y1 = Math.sin(x * wave.frequency + t * wave.speed + wave.phase) * wave.amplitude;
          const y2 = Math.sin(x * wave.frequency * 1.7 + t * wave.speed * 0.6 + wave.phase * 1.4) * wave.amplitude * 0.35;
          const y3 = Math.sin(x * wave.frequency * 0.4 + t * wave.speed * 1.2) * wave.amplitude * 0.2;
          const dx = nx - mouse.x;
          const dy = (baseY / h) - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const push = Math.exp(-dist * dist * 6) * (mxInf + myInf);
          const y = baseY + y1 + y2 + y3 + push;
          x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        const hue = wave.hue + Math.sin(t * 0.003) * 12;
        const sat = 35 + Math.sin(t * 0.004 + wave.phase) * 20;
        ctx.strokeStyle = `hsla(${hue}, ${sat}%, 55%, ${wave.alpha})`;
        ctx.lineWidth = wave.thickness;
        ctx.stroke();
      }

      function animate() {
        time++;
        ctx.clearRect(0, 0, w, h);
        const grd = ctx.createRadialGradient(w * mouse.x, h * mouse.y, 0, w * mouse.x, h * mouse.y, w * 0.45);
        grd.addColorStop(0, "rgba(50, 30, 90, 0.07)");
        grd.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, w, h);
        waves.forEach((wave) => drawWave(wave, time));
        animId = requestAnimationFrame(animate);
      }
      animate();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) cancelAnimationFrame(animId); else animate();
      });
    })();
  </script>

  <script>
    // フォーム送信後の処理
    const form = document.getElementById("contact-form");
    const success = document.getElementById("form-success");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" }
      });
      if (res.ok) {
        form.style.display = "none";
        success.style.display = "block";
      } else {
        alert("送信に失敗しました。時間をおいて再度お試しください。");
      }
    });
  </script>

  <script src="main.js"></script>
</body>
</html>
