<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Sans+JP:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --font-display: "Cormorant Garamond", serif;
      --font-mincho: "Shippori Mincho", serif;
      --font-body: "Noto Sans JP", sans-serif;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #0a0a0c;
      color: #e8e8e8;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .home-overlay {
      position: relative;
      z-index: 1;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 4vw, 48px);
    }

    /* Top */
    .home-identity {
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }
    .home-name {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.5vw, 3.6rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: #fff;
    }
    .home-tagline {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      margin-top: 8px;
      font-weight: 300;
    }
    .home-tagline span {
      margin-right: 4px;
      color: rgba(255,255,255,0.2);
    }

    /* Nav */
    .home-nav {
      margin-top: clamp(40px, 6vh, 80px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }
    .home-nav a {
      font-size: 0.88rem;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.3s, transform 0.3s;
      display: inline-block;
      width: fit-content;
    }
    .home-nav a:hover {
      color: #fff;
      transform: translateX(6px);
    }

    /* Bottom */
    .home-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      animation: fadeUp 1s ease 0.9s forwards;
    }
    .home-headline { max-width: 620px; }
    .home-headline__main {
      font-family: var(--font-mincho);
      font-size: clamp(1.2rem, 2.8vw, 1.65rem);
      font-weight: 500;
      line-height: 1.9;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.9);
    }
    .home-headline__main em {
      font-style: normal;
      color: #fff;
    }
    .home-headline__sub {
      font-size: 0.76rem;
      color: rgba(255,255,255,0.3);

    /* Numbers */
    .home-numbers {
      display: flex;
      gap: clamp(24px, 4vw, 48px);
      align-items: flex-end;
    }
    .home-numbers__item { text-align: right; }
    .home-numbers__value {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .home-numbers__label {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.06em;
      margin-top: 4px;
      display: block;
      white-space: nowrap;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .home-bottom {
        flex-direction: column;
        gap: 36px;
        align-items: flex-start;
      }
      .home-numbers { align-items: flex-start; gap: 20px; }
      .home-numbers__item { text-align: left; }
    }
    @media (max-width: 480px) {
      .home-nav { gap: 10px; }
      .home-nav a { font-size: 0.84rem; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="home-overlay">
    <div>
      <div class="home-identity">
        <h1 class="home-name">izumiemi</h1>
        <p class="home-tagline"><span>—</span> Freelance Creator × AI Automation</p>
      </div>
      <nav class="home-nav">
        <a href="works.html">Works</a>
        <a href="skills.html">Skills</a>
        <a href="mindset.html">Mindset</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>

    <div class="home-bottom">
      <div class="home-headline">
        <p class="home-headline__main">映像制作とAI自動化で、<em>結果を出す。</em></p>
        <p class="home-headline__sub">
          Adobe製品での動画制作歴12年。<br>
          AIツールと自動化の組み合わせで制作時間を最大1/6に圧縮。<br>
          フルリモート・全国対応。
        </p>
      </div>
      <div class="home-numbers">
        <div class="home-numbers__item">
          <span class="home-numbers__value">12Y</span>
          <span class="home-numbers__label">フリーランス歴</span>
        </div>
        <div class="home-numbers__item">
          <span class="home-numbers__value">10+</span>
          <span class="home-numbers__label">チャンネル</span>
        </div>
        <div class="home-numbers__item">
          <span class="home-numbers__value">1/6</span>
          <span class="home-numbers__label">圧縮率</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      let w, h, time = 0, animId;
      let mouse = { x: 0.5, y: 0.5 };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX / w; mouse.y = e.clientY / h;
      });

      const waves = [];
      const waveCount = 22;
      for (let i = 0; i < waveCount; i++) {
        const t = i / waveCount;
        waves.push({
          yOffset: 0.2 + t * 0.6,
          amplitude: 35 + Math.random() * 55,
          frequency: 0.002 + Math.random() * 0.003,
          speed: 0.008 + Math.random() * 0.012,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.03 + (1 - Math.abs(t - 0.5) * 2) * 0.1,
          hue: 235 + i * 5.5,
          thickness: 0.6 + Math.random() * 0.5,
        });
      }

      function drawWave(wave, t) {
        ctx.beginPath();
        const mxInf = (mouse.x - 0.5) * 40;
        const myInf = (mouse.y - 0.5) * 25;
        for (let x = -20; x <= w + 20; x += 3) {
          const nx = x / w;
          const baseY = h * wave.yOffset;
          const y1 = Math.sin(x * wave.frequency + t * wave.speed + wave.phase) * wave.amplitude;
          const y2 = Math.sin(x * wave.frequency * 1.7 + t * wave.speed * 0.6 + wave.phase * 1.4) * wave.amplitude * 0.35;
          const y3 = Math.sin(x * wave.frequency * 0.4 + t * wave.speed * 1.2) * wave.amplitude * 0.2;
          const dx = nx - mouse.x;
          const dy = (baseY / h) - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const push = Math.exp(-dist * dist * 6) * (mxInf + myInf);
          const y = baseY + y1 + y2 + y3 + push;
          x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        const hue = wave.hue + Math.sin(t * 0.003) * 12;
        const sat = 35 + Math.sin(t * 0.004 + wave.phase) * 20;
        ctx.strokeStyle = `hsla(${hue}, ${sat}%, 55%, ${wave.alpha})`;
        ctx.lineWidth = wave.thickness;
        ctx.stroke();
      }

      function animate() {
        time++;
        ctx.clearRect(0, 0, w, h);
        const grd = ctx.createRadialGradient(w * mouse.x, h * mouse.y, 0, w * mouse.x, h * mouse.y, w * 0.45);
        grd.addColorStop(0, "rgba(50, 30, 90, 0.07)");
        grd.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, w, h);
        waves.forEach((wave) => drawWave(wave, time));
        animId = requestAnimationFrame(animate);
      }
      animate();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) cancelAnimationFrame(animId); else animate();
      });
    })();
  </script>
</body>
</html>
